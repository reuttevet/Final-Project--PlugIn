function mockApi(body){
  return new Promise(res=>setTimeout(()=>{
    const {action,table,payload={}}=body;
    if(action==="chat"){
      res({reply:mockAgent(body.message)}); return;
    }
    if(action==="list"){ res({records:(DEMO[table]||[]).slice()}); return; }
    if(action==="create"){
      const id=table[0].toLowerCase()+Date.now();
      const rec={id,fields:{...payload.fields, Created:payload.fields.Created||d(today.getDate())}};
      (DEMO[table]=DEMO[table]||[]).unshift(rec);
      res({ok:true,record:rec}); return;
    }
    if(action==="update"){
      const arr=DEMO[table]||[]; const r=arr.find(x=>x.id===payload.id);
      if(r) r.fields={...r.fields,...payload.fields};
      res({ok:true,record:r}); return;
    }
    res({ok:false,error:"unknown action"});
  }, WEBHOOK_URL?0:260));
}
function mockAgent(msg){
  const m=(msg||"").toLowerCase();
  if(m.includes("הכנס")||m.includes("רווח")||m.includes("כמה")){
    const rev=revenueThisMonth();
    return `החודש נכנסו ${fmt(rev)} מחשבוניות ששולמו. יש ${DEMO.Invoices.filter(i=>i.fields.Status!=="Paid").length} חשבוניות פתוחות.`;
  }
  if(m.includes("ליד")) return `יש ${DEMO.Leads.length} לידים. ${DEMO.Leads.filter(l=>l.fields.Status==="New").length} חדשים ממתינים למענה.`;
  if(m.includes("משימ")) return `יש ${DEMO.Tasks.filter(t=>t.fields.Status!=="Done").length} משימות פתוחות להיום.`;
  if(m.includes("חשבונית")) return `להפקת חשבונית — פתחי "חשבוניות" ולחצי + חשבונית חדשה. הכתיבה תפעיל את הסוכן ב-n8n שמחשב מע\"מ, מספר ומפיק PDF.`;
  return "אני העוזר של הקוקפיט. אפשר לשאול אותי על הכנסות, לידים, משימות או לבקש ממני להפיק מסמך. (במצב דמו — בדיפלוי אמיתי זה מגיע מהסוכן ב-n8n.)";
}

function Cell({col,val}){
  if(col.type==="money") return <span className="num">{fmt(val)}</span>;
  if(col.type==="date") return <span className="num">{fmtDate(val)}</span>;
  if(col.type==="status") return <Pill v={val}/>;
  if(col.type==="stock") return val ? <span className="pill good">במלאי</span> : <span className="pill crit">אזל</span>;
  if(col.type==="doc") return val ? <a className="doc-link" href={val} target="_blank" rel="noopener" onClick={e=>e.stopPropagation()}><Icon d={I.doc} size={15}/>מסמך</a> : <span style={{color:"var(--faint)"}}>—</span>;
  if(col.type==="trunc") return <span style={{color:"var(--muted)",maxWidth:260,overflow:"hidden",textOverflow:"ellipsis",display:"inline-block",whiteSpace:"nowrap",verticalAlign:"bottom"}}>{val||"—"}</span>;
  return <span>{val===undefined||val===""?"—":String(val)}</span>;
}

}

              <td><Cell col={{type:"money"}} val={r.fields.Total}/></td>
              <td><Pill v={r.fields.Status}/></td>
              <td><Cell col={{type:"doc"}} val={r.fields.PdfUrl}/></td>
              <td><Cell col={{type:"date"}} val={r.fields.Created}/></td>
            </tr>))}</tbody>
        </table>
      </div>
    </div>
  </>;
}

/* ---------------- Table screen ---------------- */
function TableScreen({table,rows,loading,onOpen}){
  const cfg=TABLES[table];
  const [q,setQ]=useState(""); const [f,setF]=useState("");
  const filtered=useMemo(()=>rows.filter(r=>{
    const hitQ=!q||cfg.search.some(k=>String(r.fields[k]||"").toLowerCase().includes(q.toLowerCase()));
    const hitF=!f||String(r.fields[cfg.filter?.k])===f;
    return hitQ&&hitF;
  }),[rows,q,f,table]);
  return <>
    <div className="toolbar">
      <div className="search">
        <span className="ic"><Icon d={I.search} size={17}/></span>
        <input placeholder={"חיפוש ב"+cfg.label+"…"} value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      {cfg.filter && <select className="filter" value={f} onChange={e=>setF(e.target.value)}>
        <option value="">כל הסטטוסים</option>
        {cfg.filter.opts.map(o=><option key={o} value={o}>{(STATUS_STYLE[o]&&STATUS_STYLE[o][1])||o}</option>)}
      </select>}
      <span className="count">{filtered.length} רשומות</span>
    </div>
    <div className="tablewrap"><div className="tscroll">
      <table>
        <thead><tr>{cfg.columns.map(c=><th key={c.k}>{c.t}</th>)}</tr></thead>
        <tbody>
          {loading? <tr><td colSpan={cfg.columns.length}><div className="empty">טוען…</div></td></tr>
          : filtered.length===0? <tr><td colSpan={cfg.columns.length}><div className="empty">לא נמצאו רשומות</div></td></tr>
          : filtered.map(r=>(
            <tr key={r.id} onClick={()=>onOpen(r)}>
              {cfg.columns.map(c=><td key={c.k}><Cell col={c} val={r.fields[c.k]}/></td>)}
            </tr>))}
        </tbody>
      </table>
    </div></div>
  </>;
}

/* ---------------- Detail drawer ---------------- */
function DetailDrawer({table,row,onClose}){
  const cfg=TABLES[table];
  return <>
    <div className="scrim" onClick={onClose}/>
    <aside className="drawer" role="dialog" aria-label="פרטי רשומה">
      <div className="dh">
        <button className="btn iconbtn ghost" onClick={onClose} aria-label="סגירה"><Icon d={I.close}/></button>
        <h3>{row.fields[cfg.columns[0].k]}</h3>
      </div>
      <div className="db">
        <dl className="kv">
          {cfg.columns.map(c=>(<React.Fragment key={c.k}>
            <dt>{c.t}</dt><dd><Cell col={c} val={row.fields[c.k]}/></dd>
          </React.Fragment>))}
          {row.fields.Description && !cfg.columns.find(c=>c.k==="Description"&&c.type!=="trunc") &&
            <><dt>תיאור מלא</dt><dd style={{whiteSpace:"normal",lineHeight:1.6}}>{row.fields.Description}</dd></>}
        </dl>
      </div>
    </aside>
  </>;
}

/* ---------------- Create form ---------------- */
function CreateForm({table,onClose,onCreated}){
  const cfg=TABLES[table];
  const [v,setV]=useState({}); const [err,setErr]=useState({}); const [busy,setBusy]=useState(false);
  const set=(k,val)=>setV(s=>({...s,[k]:val}));
  async function submit(){
    const e={};
    cfg.form.forEach(fld=>{ if(fld.req && !String(v[fld.k]??"").trim()) e[fld.k]="שדה חובה"; });
    setErr(e); if(Object.keys(e).length) return;
    setBusy(true);
    const fields={...v};
    cfg.form.forEach(f=>{ if(f.type==="number"&&fields[f.k]!=null) fields[f.k]=Number(fields[f.k]); });
    // Invoice: compute VAT/Total client-side for preview; n8n is source of truth on real deploy
    if(table==="Invoices"&&fields.Amount!=null){ fields.VatAmount=Math.round(fields.Amount*0.18*100)/100; fields.Total=Math.round(fields.Amount*1.18*100)/100; }
    const res=await createRow(table,fields);
    setBusy(false);
    if(res&&res.ok!==false){ toast("נשמר בהצלחה — הטריגר ב-n8n הופעל","ok"); onCreated(); onClose(); }
    else toast("שמירה נכשלה","bad");
  }
  return <>
    <div className="scrim" onClick={onClose}/>
    <aside className="drawer" role="dialog" aria-label={"יצירת "+cfg.label}>
      <div className="dh">
        <button className="btn iconbtn ghost" onClick={onClose} aria-label="סגירה"><Icon d={I.close}/></button>
        <h3>רשומה חדשה — {cfg.label}</h3>
      </div>
      <div className="db">
        {cfg.form.map(fld=>(
          <div className={"field "+(err[fld.k]?"invalid":"")} key={fld.k}>
            <label htmlFor={"f_"+fld.k}>{fld.t}{fld.req&&" *"}</label>
            {fld.type==="select"
              ? <select id={"f_"+fld.k} value={v[fld.k]||""} onChange={e=>set(fld.k,e.target.value)}>
                  <option value="">בחרי…</option>
                  {fld.opts.map(o=><option key={o} value={o}>{(STATUS_STYLE[o]&&STATUS_STYLE[o][1])||o}</option>)}
                </select>
              : fld.type==="textarea"
              ? <textarea id={"f_"+fld.k} rows={3} value={v[fld.k]||""} onChange={e=>set(fld.k,e.target.value)}/>
              : <input id={"f_"+fld.k} type={fld.type==="number"?"number":fld.type==="email"?"email":"text"}
                  value={v[fld.k]||""} onChange={e=>set(fld.k,e.target.value)}/>}
            {err[fld.k]&&<span className="err">{err[fld.k]}</span>}
          </div>))}
        {table==="Invoices" && <div style={{fontSize:12,color:"var(--faint)",marginTop:-4}}>מע"מ (18%) והסה"כ מחושבים אוטומטית ע"י הסוכן ב-n8n בעת ההפקה.</div>}
      </div>
      <div className="df">
        <button className="btn primary" disabled={busy} onClick={submit}>{busy?"שומר…":"שמירה"}</button>
        <button className="btn ghost" onClick={onClose}>ביטול</button>
      </div>
    </aside>
  </>;
}

/* ---------------- Chat ---------------- */
function ChatPanel({onClose}){
  const [msgs,setMsgs]=useState([{who:"bot",text:"בוקר טוב! אני העוזר של הקוקפיט. אפשר לשאול על הכנסות, לידים ומשימות, או לבקש להפיק מסמך."}]);
  const [inp,setInp]=useState(""); const [busy,setBusy]=useState(false);
  const boxRef=useRef();
  useEffect(()=>{if(boxRef.current)boxRef.current.scrollTop=boxRef.current.scrollHeight;},[msgs,busy]);
  async function send(){
    const text=inp.trim(); if(!text||busy) return;
    setMsgs(m=>[...m,{who:"me",text}]); setInp(""); setBusy(true);
    const res=await sendChat(text);
    setBusy(false);
    setMsgs(m=>[...m,{who:"bot",text:(res&&res.reply)||"לא התקבלה תשובה מהסוכן."}]);
  }
  return <>
    <div className="scrim" onClick={onClose}/>
    <aside className="chatpanel" role="dialog" aria-label="עוזר">
      <div className="ch">
        <button className="btn iconbtn ghost" onClick={onClose} aria-label="סגירה"><Icon d={I.close}/></button>
        <span className="av"><Icon d={I.chat} size={18}/></span>
        <div><h3>עוזר</h3><div className="sub">מחובר ל-n8n</div></div>
      </div>
      <div className="msgs" ref={boxRef}>
        {msgs.map((m,i)=><div key={i} className={"msg "+(m.who==="me"?"me":"bot")}>{m.text}</div>)}
        {busy && <div className="typing"><i/><i/><i/></div>}
      </div>
      <div className="chatin">
        <input placeholder="כתבי הודעה…" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
        <button onClick={send} aria-label="שליחה"><Icon d={I.send} size={19}/></button>
      </div>
    </aside>
  </>;
}

/* ---------------- App shell ---------------- */
const NAV=["Dashboard","Customers","Leads","Orders","Invoices","Products","Tasks"];
const NAVMETA={Dashboard:{label:"דשבורד",icon:I.dash}, Tasks:{label:"משימות",icon:I.task}};
function App(){
  const [view,setView]=useState("Dashboard");
  const [data,setData]=useState({});
  const [loading,setLoading]=useState(true);
  const [detail,setDetail]=useState(null);
  const [creating,setCreating]=useState(null);
  const [chat,setChat]=useState(false);
  const [sideOpen,setSideOpen]=useState(false);
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem("cockpit-theme")||"";}catch(e){return"";}});

  useEffect(()=>{ if(theme){document.documentElement.setAttribute("data-theme",theme);} else {document.documentElement.removeAttribute("data-theme");}
    try{localStorage.setItem("cockpit-theme",theme);}catch(e){} },[theme]);

  async function loadAll(){
    setLoading(true);
    const tables=["Customers","Leads","Orders","Invoices","Products","Tasks"];
    const out={};
    await Promise.all(tables.map(async t=>{ const r=await listRows(t); out[t]=(r&&r.records)||[]; }));
    setData(out); setLoading(false);
  }
  useEffect(()=>{loadAll();},[]);

  const go=(v)=>{setView(v);setSideOpen(false);};
  const meta=NAVMETA[view]||(TABLES[view]&&{label:TABLES[view].label,icon:TABLES[view].icon})||{label:view};
  const subtitle={Dashboard:"מבט בוקר על העסק",Customers:"ניהול לקוחות",Leads:"מעקב לידים וסטטוסים",
    Orders:"הזמנות פתוחות וסגורות",Invoices:"חשבוניות ומסמכים",Products:"קטלוג מוצרים ושירותים",Tasks:"משימות הצוות"}[view];

  return <div className="app">
    <aside className={"side "+(sideOpen?"open":"")}>
      <div className="brand">
        <span className="logo"><Icon d={I.dash} size={19}/></span>
        <div><b>קוקפיט</b><span>ניהול אלקטרוניקה</span></div>
      </div>
      <nav className="nav">
        {NAV.map(v=>{const m=NAVMETA[v]||{label:TABLES[v].label,icon:TABLES[v].icon};
          const cnt=v!=="Dashboard"&&data[v]?data[v].length:null;
          return <button key={v} className={view===v?"on":""} onClick={()=>go(v)}>
            <Icon d={m.icon} className="ic"/>{m.label}
            {cnt!=null&&<span className="badge">{cnt}</span>}
          </button>;})}
      </nav>
      <div className="foot">
        <span className="logo" style={{width:32,height:32,fontSize:13}}>ב</span>
        <div className="who"><b>בעל/ת העסק</b>מחובר/ת</div>
        <button className="btn iconbtn ghost" style={{marginInlineStart:"auto"}} onClick={()=>setTheme(t=>t==="dark"?"light":"dark")} aria-label="החלפת ערכת נושא">
          <Icon d={theme==="dark"?I.sun:I.moon} size={18}/>
        </button>
      </div>
    </aside>

    <main className="main">
      <header className="topbar">
        <button className="btn iconbtn ghost mobtop" onClick={()=>setSideOpen(o=>!o)} aria-label="תפריט"><Icon d={I.menu}/></button>
        <div>
          <h1>{meta.label}</h1>
          <div className="sub">{subtitle}</div>
        </div>
        <div className="spacer"/>
        {TABLES[view]&&["Customers","Leads","Orders","Invoices"].includes(view) &&
          <button className="btn primary" onClick={()=>setCreating(view)}><Icon d={I.plus} size={18}/>{TABLES[view].label==="לקוחות"?"לקוח חדש":TABLES[view].label==="לידים"?"ליד חדש":TABLES[view].label==="הזמנות"?"הזמנה חדשה":"חשבונית חדשה"}</button>}
      </header>
      <div className="content">
        <div className="demo-bar">
          <Icon d={I.invoice} size={16}/>
          מצב דמו — הנתונים לדוגמה. חברי את ה-webhook של n8n (משתנה WEBHOOK_URL) כדי לעבוד על נתונים אמיתיים.
        </div>
        {view==="Dashboard" && <Dashboard data={data} go={go}/>}
        {TABLES[view] && <TableScreen table={view} rows={data[view]||[]} loading={loading} onOpen={r=>setDetail({table:view,row:r})}/>}
        {view==="Tasks" && null}
      </div>
    </main>

    {detail && <DetailDrawer table={detail.table} row={detail.row} onClose={()=>setDetail(null)}/>}
    {creating && <CreateForm table={creating} onClose={()=>setCreating(null)} onCreated={loadAll}/>}
    {chat && <ChatPanel onClose={()=>setChat(false)}/>}
    {!chat && <button className="chatfab" onClick={()=>setChat(true)} aria-label="פתיחת עוזר"><Icon d={I.chat} size={24}/></button>}
    <Toaster/>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
